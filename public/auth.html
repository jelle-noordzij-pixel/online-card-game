<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drankspel – Inloggen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'DM Mono', monospace;
            display: flex; align-items: center; justify-content: center;
            min-height: 100dvh; padding: 20px;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(0,255,204,0.06) 0%, transparent 70%);
        }
        .wrap { width: 100%; max-width: 360px; }
        h1 {
            font-family: 'Bebas Neue'; color: var(--accent);
            font-size: 3.5rem; letter-spacing: 0.12em;
            text-align: center; line-height: 1; margin-bottom: 4px;
        }
        .sub { text-align: center; font-size: 0.55rem; color: var(--muted); letter-spacing: 0.18em; margin-bottom: 28px; }
        .card {
            background: var(--surface); border: 1px solid #1e2535;
            border-radius: 20px; padding: 24px;
        }
        .field-label { font-size: 0.55rem; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .field-group { margin-bottom: 14px; }
        input {
            width: 100%; padding: 11px 14px;
            background: var(--surface2); border: 1px solid #2a3040;
            color: var(--text); border-radius: 10px;
            font-family: 'DM Mono', monospace; font-size: 0.85rem;
            outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-family: 'Bebas Neue'; font-size: 1.2rem; letter-spacing: 0.1em;
            cursor: pointer; margin-bottom: 10px;
            transition: transform 0.1s, filter 0.1s;
        }
        .btn:active { transform: scale(0.97); filter: brightness(0.85); }
        .btn-primary { background: var(--accent); color: #0a0d10; }
        .btn-secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-muted { background: transparent; color: var(--muted); border: 1px solid #2a3040; font-size: 1rem; }
        #msg { min-height: 20px; font-size: 0.72rem; color: var(--danger); margin-bottom: 14px; text-align: center; }
        #msg.ok { color: var(--accent); }
        hr { border: none; border-top: 1px solid #1e2535; margin: 16px 0; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>DRANKSPEL</h1>
    <p class="sub">KAARTSPEL · BIER VEREIST</p>
    <div class="card">
        <div id="msg"></div>
        <div class="field-group">
            <span class="field-label">E-mailadres</span>
            <input type="email" id="email" placeholder="naam@email.com" autocomplete="email">
        </div>
        <div class="field-group">
            <span class="field-label">Wachtwoord</span>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" onclick="login()">INLOGGEN</button>
        <button class="btn btn-secondary" onclick="register()">ACCOUNT AANMAKEN</button>
        <hr>
        <button class="btn btn-muted" onclick="guest()">VERDER ALS GAST</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sb = supabase.createClient(
        'https://caossvejzjutuwqsjdxc.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhb3NzdmVqemp1dHV3cXNqZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzM5MjEsImV4cCI6MjA5NDI0OTkyMX0.wjv6tRfeQX-0FORoBbSQgr-TbHWdLLThG4RPV4DCNk4'
    );
    const msgEl = document.getElementById('msg');
    const show = (t, ok) => { msgEl.textContent = t; msgEl.className = ok ? 'ok' : ''; };

    sb.auth.getSession().then(({ data: { session } }) => {
        if (session) { sessionStorage.setItem('userName', session.user.email.split('@')[0]); location.href = 'index.html'; }
    });

    async function login() {
        show('Bezig…');
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
        if (error) { show(error.message); return; }
        const { data: { session } } = await sb.auth.getSession();
        sessionStorage.setItem('userName', session.user.email.split('@')[0]);
        location.href = 'index.html';
    }
    async function register() {
        show('Bezig…');
        const { error } = await sb.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value });
        if (error) { show(error.message); return; }
        show('Account aangemaakt! Check je e-mail.', true);
    }
    function guest() {
        sessionStorage.setItem('userName', 'Gast_' + Math.floor(1000 + Math.random() * 9000));
        sessionStorage.setItem('isGuest', '1');
        location.href = 'index.html';
    }
</script>
</body>
</html>
