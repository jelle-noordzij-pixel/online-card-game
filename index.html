<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drankspel</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffcc; --bg: #0a0d10; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        #setup-menu { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
        .btn { padding: 20px; font-family: 'Bebas Neue'; font-size: 2rem; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; width: 100%; }
        .score-bar { display: flex; background: #131720; padding: 10px; gap: 5px; }
        .pill { flex: 1; padding: 5px; background: #1c2130; border-radius: 5px; font-size: 0.8rem; }
        .card { width: 70px; height: 100px; background: white; color: black; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; margin: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="setup-menu">
    <h1 style="color:var(--accent); font-family:'Bebas Neue';">DRANKSPEL ONLINE</h1>
    <input id="naamInput" type="text" placeholder="JE NAAM" style="padding:15px; font-size:1rem; margin-bottom:10px;">
    <button class="btn" style="background:var(--accent);" onclick="verstuurJoin()">JOIN</button>
    <button id="startKnop" class="btn" style="background:orange; display:none;" onclick="verstuurStart()">START SPEL</button>
</div>

<div class="score-bar" id="scoreBar"></div>

<div id="speelveld" style="margin-top:20px;">
    <p>AFLEGSTAPEL:</p>
    <div id="openKaart" class="card">?</div>
    <p>JOUW KAARTEN:</p>
    <div id="hand"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function verstuurJoin() {
        const n = document.getElementById("naamInput").value;
        if(n) {
            socket.emit("joinGame", n);
            document.getElementById("startKnop").style.display = "block";
        }
    }

    function verstuurStart() {
        console.log("Klik gedetecteerd!");
        socket.emit("GO"); // We sturen nu 'GO'
    }

    socket.on("updateState", (state) => {
        console.log("Data binnen:", state);
        
        // Scores
        const sb = document.getElementById("scoreBar");
        sb.innerHTML = "";
        state.playerOrder.forEach(id => {
            const p = state.players[id];
            sb.innerHTML += `<div class="pill">${p.name}<br>${p.score}</div>`;
        });

        // Spelersscherm
        if (state.status === 'PLAYING') {
            document.getElementById("setup-menu").style.display = "none";
            
            // Bovenste kaart
            const top = state.tableStack[state.tableStack.length - 1];
            if(top) document.getElementById("openKaart").innerHTML = top.v + (top.s || "");

            // Hand
            const hDiv = document.getElementById("hand");
            hDiv.innerHTML = "";
            const ik = state.players[socket.id];
            if(ik && ik.hand) {
                ik.hand.forEach(c => {
                    const kaartEl = document.createElement("div");
                    kaartEl.className = "card";
                    kaartEl.innerHTML = c.v + (c.s || "");
                    hDiv.appendChild(kaartEl);
                });
            }
        }
    });
</script>
</body>
</html>
