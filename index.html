<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 15vw; --card-h: 22vw;
            --red: #e74c3c; --blue: #3b82f6;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(255,51,102,0.04) 0%, transparent 60%);
        }

        /* ── ANIMATIONS ── */
        @keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-7px); } 35% { transform: translateX(7px); } 55% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .error-shake { animation: shake 0.45s ease-in-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,255,204,0.4); } 50% { box-shadow: 0 0 0 6px rgba(0,255,204,0); } }

        /* ── SCOREBAR ── */
        .top-bar { display: grid; gap: 6px; padding: 8px 10px; background: var(--surface); flex-shrink: 0; border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 7px 4px; border-radius: 8px; border-bottom: 2px solid #2a3040; text-align: center; font-size: 0.6rem; transition: all 0.3s; letter-spacing: 0.03em; }
        .score-pill .name { font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 0.05em; color: var(--muted); }
        .score-pill .pts { font-size: 1rem; font-family: 'Bebas Neue', sans-serif; color: var(--text); }
        .active-player { border-bottom-color: var(--accent) !important; animation: pulse 1.5s infinite; }
        .active-player .name { color: var(--accent) !important; }

        /* ── GAME AREA ── */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; position: relative; padding: 5px 0; min-height: 0; }
        #status { color: var(--accent); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; height: 14px; text-align: center; }

        /* ── CARDS ── */
        .card {
            width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 7px;
            display: flex; flex-direction: column; padding: 4px; position: absolute; color: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            pointer-events: none; font-family: 'DM Mono', monospace;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s;
        }
        .card.red { color: var(--red); }
        .card.black { color: #1a1a2e; }
        .card.special { color: white; background: linear-gradient(135deg, #1d4ed8, #3b82f6); border-color: #60a5fa; }
        .card.joker { color: #1a1a1a; background: linear-gradient(135deg, #f59e0b, #fcd34d); border-color: #fbbf24; }
        .card.back { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); border: 2px solid rgba(0,255,204,0.2); }
        .card.selected { transform: translateY(-22px) scale(1.04) !important; border: 2px solid var(--accent) !important; box-shadow: 0 0 20px rgba(0,255,204,0.5) !important; z-index: 200 !important; }
        .card-target { transform: translateX(-40px) rotate(-7deg) !important; z-index: 100 !important; border: 2px solid var(--accent) !important; }
        .card-my-discard { transform: translateX(22px) rotate(4deg) !important; z-index: 110 !important; opacity: 0.55; }
        .card-corner { font-size: 2.8vw; font-weight: 700; line-height: 1.1; }
        .card-center { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 6.5vw; font-weight: bold; }

        /* ── STACKS ── */
        .stacks-row { display: flex; gap: 14vw; align-items: center; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .stack-label { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 0.5rem; color: var(--muted); text-transform: uppercase; }
        .deck-count { position: absolute; top: -18px; right: 0; font-size: 0.5rem; color: var(--muted); }

        /* ── HAND ── */
        #player-hand { display: flex; gap: 5px; align-items: flex-end; }
        .card-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .slot-empty { width: var(--card-w); height: var(--card-h); border: 1px dashed rgba(255,255,255,0.1); border-radius: 7px; opacity: 0.3; }

        /* ── CONTROLS ── */
        .controls { padding: 10px 12px 12px; display: flex; gap: 10px; background: var(--surface); flex-shrink: 0; border-top: 1px solid #1e2535; }
        .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; cursor: pointer; }
        .btn-accent { background: var(--accent); color: #0a0d10; }
        .btn-danger { background: var(--danger); color: white; }

        /* ── REVEAL ── */
        #reveal-overlay { position: fixed; inset: 0; background: rgba(8,10,15,0.97); z-index: 1000; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
        .reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .player-result-card { background: var(--surface2); border: 1px solid #2a3040; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: center; animation: slideUp 0.3s ease both; }
        .mini-card { position: static !important; width: 9vw !important; height: 13vw !important; transform: none !important; }

        /* ── SETUP / LOBBY MENU ── */
        #setup-menu { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; overflow-y: auto; }
        .menu-card { background: var(--surface); border: 1px solid #1e2535; padding: 22px; border-radius: 20px; max-width: 400px; margin: 0 auto; width: 100%; }
        .code-display { font-family: 'Bebas Neue'; font-size: 3rem; color: var(--accent); text-align: center; letter-spacing: 0.1em; margin: 10px 0; }
        .logout-btn { color: var(--danger); font-size: 0.6rem; text-decoration: underline; cursor: pointer; margin-top: 15px; display: block; text-align: center; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-inner">
        <div class="menu-card">
            <h1 style="font-family:'Bebas Neue'; color:var(--accent); text-align:center; margin:0;">DRANKSPEL</h1>
            <p id="welcome-text" style="text-align:center; color:var(--muted); font-size:0.7rem; margin-bottom: 20px;"></p>
            
            <div id="join-options">
                <button class="btn btn-accent" style="width:100%; margin-bottom:15px;" onclick="createRoom()">NIEUW SPEL STARTEN</button>
                <div style="display:flex; gap:10px;">
                    <input id="code-input" type="number" placeholder="4 CIJFERS" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);" style="flex:1; padding:12px; background:var(--surface2); color:white; border-radius:10px; border:1px solid #2a3040; text-align:center;">
                    <button class="btn btn-accent" style="flex:0.6;" onclick="joinRoom()">JOIN</button>
                </div>
                <span class="logout-btn" onclick="doLogout()">UITLOGGEN</span>
            </div>

            <div id="lobby-section" style="display:none;">
                <p style="text-align:center; color:var(--muted); font-size:0.6rem;">CODE VOOR VRIENDEN:</p>
                <div id="display-code" class="code-display">0000</div>
                <div id="lobby-players" style="margin-bottom:15px;"></div>
                <button class="btn btn-accent" id="start-btn" style="width:100%;" disabled onclick="startGame()">WACHT OP SPELERS…</button>
            </div>
        </div>
    </div>
</div>

<div id="reveal-overlay">
    <div class="reveal-title" id="reveal-title" style="font-family:'Bebas Neue'; color:var(--accent); text-align:center; font-size:2rem;">RONDE OVER</div>
    <div class="reveal-grid" id="reveal-grid"></div>
    <button class="btn btn-accent" id="next-round-btn" style="margin-top:16px; width:100%;" onclick="nextRound()">VOLGENDE RONDE →</button>
</div>

<div class="top-bar" id="top-bar"></div>

<div id="game-area">
    <div id="status"></div>
    <div class="stacks-row">
        <div class="stack-wrap" onclick="drawFromDeck()">
            <div class="deck-count" id="deck-count"></div>
            <div class="card back"></div>
            <span class="stack-label">DECK</span>
        </div>
        <div class="stack-wrap" id="open-stack" onclick="drawFromOpen()">
            <span class="stack-label">OPEN</span>
        </div>
    </div>
    <div id="player-hand"></div>
</div>

<div class="controls">
    <button id="call-btn" class="btn btn-danger" style="display:none;" onclick="doCall()">CALL!</button>
    <button id="action-btn" class="btn btn-accent" style="visibility:hidden;" onclick="confirmDiscard()">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
    const socket = io();
    let myId, myState, currentUser, selected = [];

    // ── AUTH CHECK ──
    async function checkAuth() {
        const { data: { session } } = await sb.auth.getSession();
        if (!session) window.location.href = 'auth.html';
        currentUser = session.user;
        document.getElementById('welcome-text').innerText = "Ingelogd als: " + (currentUser.user_metadata.username || "Speler");
    }
    checkAuth();

    async function doLogout() { await sb.auth.signOut(); window.location.href = 'auth.html'; }

    // ── HELPERS ──
    function cardLabel(v) {
        if (v === 0) return 'J'; if (v === 1) return 'A';
        if (v === 11) return 'B'; if (v === 12) return 'V'; if (v === 13) return 'H';
        return v;
    }

    function createCardEl(c, isMini = false, offsetIdx = 0) {
        const div = document.createElement('div');
        const type = !c ? 'back' : (c.v === 0 ? 'joker' : (c.v === 11 ? 'special' : (c.s === '♥' || c.s === '♦' ? 'red' : 'black')));
        div.className = `card ${type}${isMini ? ' mini-card' : ''}`;
        if (!isMini && offsetIdx > 0) div.style.transform = `translate(${offsetIdx*1.5}px,${offsetIdx*1.5}px) rotate(${offsetIdx%2===0?0.8:-0.8}deg)`;
        if (c) {
            const lbl = cardLabel(c.v);
            div.innerHTML = `<div class="card-corner">${lbl}<br>${c.s||''}</div><div class="card-center">${c.s||lbl}</div>`;
        }
        return div;
    }

    // ── ACTIES ──
    function createRoom() { socket.emit('createRoom', { userId: currentUser.id }); }
    function joinRoom() { 
        const code = document.getElementById('code-input').value;
        if (code.length === 4) socket.emit('joinRoom', { code, userId: currentUser.id });
    }
    function startGame() { socket.emit('startGame'); }
    function nextRound() { socket.emit('nextRound'); }
    function drawFromDeck() { socket.emit('drawFromDeck'); }
    function drawFromOpen() { socket.emit('drawFromOpen'); }
    function doCall() { socket.emit('call'); }
    function confirmDiscard() { socket.emit('discard', { indices: selected }); selected = []; }

    // ── SOCKET ──
    socket.on('connect', () => { myId = socket.id; });
    socket.on('updateState', (state) => {
        myState = state;
        if (state.status === 'LOBBY') renderLobby(state);
        else if (state.status === 'PLAYING') renderGame(state);
        else if (state.status === 'REVEAL') renderReveal(state);
    });

    function renderLobby(state) {
        document.getElementById('setup-menu').style.display = 'flex';
        document.getElementById('join-options').style.display = 'none';
        document.getElementById('lobby-section').style.display = 'block';
        document.getElementById('display-code').innerText = state.myRoomCode;
        document.getElementById('lobby-players').innerHTML = state.playerOrder.map(id => `<div class="score-pill" style="margin-bottom:5px;">${state.players[id].name}</div>`).join('');
        const startBtn = document.getElementById('start-btn');
        if (myId === state.hostId) {
            startBtn.disabled = state.playerOrder.length < 2;
            startBtn.innerText = "SPEL STARTEN";
        } else {
            startBtn.disabled = true;
            startBtn.innerText = "WACHT OP HOST...";
        }
    }

    function renderGame(state) {
        document.getElementById('setup-menu').style.display = 'none';
        document.getElementById('reveal-overlay').style.display = 'none';
        
        const tb = document.getElementById('top-bar');
        tb.style.gridTemplateColumns = `repeat(${state.playerOrder.length}, 1fr)`;
        tb.innerHTML = state.playerOrder.map(id => `
            <div class="score-pill ${id === state.turn ? 'active-player' : ''}">
                <div class="name">${state.players[id].name}</div>
                <div class="pts">${state.totals[id]}</div>
            </div>`).join('');

        const os = document.getElementById('open-stack');
        os.innerHTML = '<span class="stack-label">OPEN</span>';
        const visible = state.tableStack.slice(-6);
        visible.forEach((c, i) => {
            const el = createCardEl(c, false, i);
            if (state.turn === myId && state.roundState === 'DRAW') {
                const dc = state.lastDiscardCount || 1;
                if (i === visible.length - dc - 1) el.classList.add('card-target');
                if (i >= visible.length - dc) el.classList.add('card-my-discard');
            }
            os.appendChild(el);
        });

        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        state.players[myId].hand.forEach((c, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'card-wrap';
            const el = createCardEl(c, false, i);
            if (selected.includes(i)) el.classList.add('selected');
            wrap.appendChild(el);
            wrap.onclick = () => {
                if (state.turn !== myId || state.roundState !== 'DISCARD') return;
                selected = selected.includes(i) ? selected.filter(x => x !== i) : [...selected, i];
                renderGame(state);
            };
            handDiv.appendChild(wrap);
        });

        document.getElementById('call-btn').style.display = (state.turn === myId && state.roundState === 'DISCARD') ? 'block' : 'none';
        document.getElementById('action-btn').style.visibility = selected.length > 0 ? 'visible' : 'hidden';
    }

    function renderReveal(state) {
        document.getElementById('reveal-overlay').style.display = 'flex';
        const grid = document.getElementById('reveal-grid');
        grid.innerHTML = '';
        state.playerOrder.forEach(id => {
            const res = state.revealData.results[id];
            const box = document.createElement('div');
            box.className = 'player-result-card';
            box.innerHTML = `<div class="name">${state.players[id].name}</div><div class="pts">${res.ptsThisRound} PT</div><div class="result-cards"></div>`;
            res.hand.forEach(c => box.querySelector('.result-cards').appendChild(createCardEl(c, true)));
            grid.appendChild(box);
        });
        document.getElementById('next-round-btn').style.display = myId === state.hostId ? 'block' : 'none';
    }
</script>
</body>
</html>
