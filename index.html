<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kamo</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
}

#topbar{
    background:#111827;
    padding:10px;
    font-size:18px;
}

#game{
    padding:20px;
}

#players{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.player{
    background:#1e293b;
    padding:10px 15px;
    border-radius:12px;
    min-width:120px;
}

#middle{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    margin:30px 0;
}

.stack{
    width:120px;
    height:160px;
    background:#1e293b;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    cursor:pointer;
    position:relative;
}

.stack small{
    position:absolute;
    bottom:8px;
    font-size:12px;
    opacity:0.7;
}

#hand{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:30px;
}

.card{
    width:80px;
    height:120px;
    background:white;
    color:black;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.card.selected{
    transform:translateY(-15px);
    background:#fde68a;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    margin:5px;
}

#controls{
    margin-top:25px;
}

.green{ background:#22c55e; color:white; }
.red{ background:#ef4444; color:white; }
.blue{ background:#3b82f6; color:white; }

#status{
    margin-top:20px;
    font-size:18px;
}

input{
    padding:10px;
    border-radius:10px;
    border:none;
    margin:5px;
}
</style>
</head>
<body>

<div id="topbar">
    KAMO
</div>

<div id="menu">
    <h2>Lobby</h2>

    <input id="nameInput" placeholder="Naam">
    <input id="roomInput" placeholder="Lobby code (optioneel)">
    <br>

    <button class="green" onclick="joinGame()">Join / Create</button>
</div>

<div id="game" style="display:none;">

    <div id="roomCode"></div>

    <div id="players"></div>

    <div id="middle">

        <div class="stack" onclick="drawDeck()">
            🂠
            <small>Deck</small>
        </div>

        <div class="stack" onclick="drawOpen()" id="openStack">
            ?
            <small>Open stapel</small>
        </div>

    </div>

    <div id="controls">
        <button class="blue" onclick="discardCards()">Gooi kaarten</button>
        <button class="green" onclick="callKamo()">KAMO</button>
    </div>

    <div id="status"></div>

    <div id="hand"></div>

</div>

<script>

const socket = io();

let myId = null;
let state = null;
let selected = [];

socket.on("connect", () => {
    myId = socket.id;
});

function joinGame(){
    const name = document.getElementById("nameInput").value;
    const room = document.getElementById("roomInput").value;

    socket.emit("joinGame", { name, room });

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";
}

function cardText(c){
    if(!c) return "";

    let v = c.v;

    if(v === 0) v = "🃏";
    else if(v === 1) v = "A";
    else if(v === 11) v = "B";
    else if(v === 12) v = "V";
    else if(v === 13) v = "H";

    return v + (c.s || "");
}

socket.on("updateState", (g) => {

    state = g;

    document.getElementById("roomCode").innerHTML =
        "Lobby: <b>" + g.roomCode + "</b>";

    document.getElementById("status").innerText =
        g.lastActionText || "";

    renderPlayers();
    renderHand();
    renderOpenCard();
});

function renderPlayers(){

    const div = document.getElementById("players");
    div.innerHTML = "";

    state.playerOrder.forEach(id => {

        const p = state.players[id];

        const el = document.createElement("div");
        el.className = "player";

        let text =
            "<b>" + p.name + "</b><br>" +
            p.handCount + " kaarten";

        if(state.turn === id){
            text += "<br>🎯 Beurt";
        }

        el.innerHTML = text;

        div.appendChild(el);
    });
}

function renderHand(){

    const div = document.getElementById("hand");
    div.innerHTML = "";

    const me = state.players[myId];

    if(!me || !me.hand) return;

    me.hand.forEach((card, index) => {

        if(!card) return;

        const el = document.createElement("div");
        el.className = "card";

        if(selected.includes(index)){
            el.classList.add("selected");
        }

        el.innerText = cardText(card);

        el.onclick = () => {

            if(selected.includes(index)){
                selected = selected.filter(x => x !== index);
            } else {
                selected.push(index);
            }

            renderHand();
        };

        div.appendChild(el);
    });
}

function renderOpenCard(){

    const open = document.getElementById("openStack");

    if(!state.tableStack || state.tableStack.length === 0){
        open.innerHTML = "?<small>Open stapel</small>";
        return;
    }

    // ── BELANGRIJK ──
    // Laat ALTIJD de bovenste open kaart zien
    const topCard = state.tableStack[state.tableStack.length - 1];

    open.innerHTML =
        cardText(topCard) +
        "<small>Open stapel</small>";
}

function discardCards(){

    if(selected.length === 0) return;

    socket.emit("discard", {
        indices: selected
    });

    selected = [];
}

function drawDeck(){
    socket.emit("drawFromDeck");
}

function drawOpen(){
    socket.emit("drawFromOpen");
}

function callKamo(){
    socket.emit("call");
}

socket.on("actionError", (msg) => {
    alert(msg);
});

</script>

</body>
</html>
