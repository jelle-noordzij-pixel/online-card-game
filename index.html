<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 18vw; --card-h: 26vw;
            --text: #e8eaf0; --muted: #5a6480;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.05) 0%, transparent 60%);
        }

        /* TOP BAR */
        .top-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
            padding: 8px 10px; background: var(--surface); border-bottom: 1px solid #1e2535;
        }
        .score-pill {
            background: var(--surface2); padding: 7px 4px; border-radius: 8px;
            border-bottom: 2px solid #2a3040; text-align: center; font-size: 0.6rem;
        }
        .score-pill.active { border-bottom-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .score-pill .name { font-family: 'Bebas Neue'; font-size: 0.9rem; color: var(--muted); text-overflow: ellipsis; overflow: hidden; }
        .score-pill.active .name { color: var(--accent); }

        /* GAME AREA */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #status-msg { color: var(--accent); font-size: 0.65rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .stacks-row { display: flex; gap: 10vw; align-items: center; margin-bottom: 20px; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }

        /* CARD STYLING */
        .card {
            width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 8px;
            display: flex; flex-direction: column; padding: 6px; color: #1a1a1a;
