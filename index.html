<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 15vw; --card-h: 22vw;
            --red: #e74c3c; --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.04) 0%, transparent 60%);
        }
        .top-bar { display: grid; gap: 6px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 7px 4px; border-radius: 8px; text-align: center; font-size: 0.6rem; border-bottom: 2px solid #2a3040; }
        .active-player { border-bottom-color: var(--accent) !important; }
        .active-player .name { color: var(--accent); }
        .score-pill .name { font-family: 'Bebas Neue'; font-size: 0.85rem; }
        .score-pill .pts { font-family: 'Bebas Neue'; font-size: 1rem; }
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; position: relative; }
        #status, #action-log { font-size: 0.65rem; text-align: center; letter-spacing: 0.05em; height: 14px; }
        #action-log { color: var(--muted); margin-top: 4px; }
        .card { width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 7px; position: absolute; color: #1a1a1a; display: flex; flex-direction: column; padding: 4px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 3px 8px rgba(0,0,0,0.4); pointer-events: none; }
        .card.red { color: var(--red); }
        .card.back { background: linear-gradient(135deg, #0f172a, #1e3a5f); border: 2px solid var(--accent); }
        .card.selected { transform: translateY(-20px) scale(1.05) !important; border: 2px solid var(--accent); z-index: 200 !important; }
        .card-corner { font-size: 2.8vw; font-weight: bold; line-height: 1; }
        .card-center { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 6vw; }
        .stacks-row { display: flex; gap: 15vw; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); }
        .stack-label { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 0.5rem; color: var(--muted); }
        #player-hand { display: flex; gap: 5px; }
        .card-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .slot-empty { width: 100%; height: 100%; border: 1px dashed rgba(255,255,255,0.1); border-radius: 7px; }
        .controls { padding: 10px; display: flex; gap: 10px; background: var(--surface); border-top: 1px solid #1e2535; }
        .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; color: #000; }
        .btn-accent { background: var(--accent); }
        .btn-danger { background: var(--danger); color: #fff; }
        #setup-menu, #reveal-overlay, #gameover-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .menu-card { background: var(--surface); padding: 20px; border-radius: 15px; width: 100%; max-width: 350px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: var(--surface2); border: 1px solid #2a3040; color: #fff; border-radius: 8px; }
        #room-code-display { font-size: 2rem; color: var(--accent); font-family: 'Bebas Neue'; text-align: center; border: 1px dashed var(--accent); padding: 10px; border-radius: 10px; }
        .mini-card { width: 8vw !important; height: 12vw !important; position: static !important; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-card">
        <div id="join-section">
            <input id="name-input" type="text" placeholder="Naam...">
            <input id="room-input" type="text" placeholder="Lobby Code (Leeg = Nieuw)">
            <button class="btn btn-accent" onclick="joinGame()">SPEL STARTEN</button>
        </div>
        <div id="lobby-section" style="display:none;">
            <div id="room-code-display"></div>
            <div id="lobby-players" style="margin:15px 0;"></div>
            <div id="host-settings" style="display:none;">
                <select id="limit-val" onchange="sendRules()"><option value="50">50 PT</option><option value="100" selected>100 PT</option></select>
            </div>
            <button id="start-btn" class="btn btn-accent" disabled onclick="startGame()">WACHTEN...</button>
        </div>
    </div>
</div>

<div id="reveal-overlay" style="display:none;">
    <div id="reveal-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    <button class="btn btn-accent" id="next-round-btn" onclick="nextRound()" style="margin-top:20px;">VOLGENDE RONDE</button>
</div>

<div id="gameover-overlay" style="display:none;">
    <h1 style="color:var(--danger); font-family:'Bebas Neue';">GAME OVER</h1>
    <div id="go-losers" style="font-size:1.5rem;"></div>
    <button class="btn btn-accent" onclick="newGame()" style="margin-top:20px;">NIEUW SPEL</button>
</div>

<div class="top-bar" id="top-bar"></div>
<div id="game-area">
    <div id="status"></div>
    <div id="action-log"></div>
    <div class="stacks-row">
        <div class="stack-wrap" onclick="drawFromDeck()">
            <div class="card back"></div>
            <span class="stack-label">DECK (<span id="deck-count"></span>)</span>
        </div>
        <div class="stack-wrap" id="open-stack" onclick="drawFromOpen()"></div>
    </div>
    <div id="player-hand"></div>
</div>

<div class="controls">
    <button id="call-btn" class="btn btn-danger" style="display:none;" onclick="doCall()">CALL!</button>
    <button id="action-btn" class="btn btn-accent" style="visibility:hidden;">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myId, myState, selected = [];

function cardLabel(v) { if (v===0) return 'J'; if (v===1) return 'A'; if (v===11) return 'B'; if (v===12) return 'V'; if (v===13) return 'H'; return v; }

function createCardEl(c, isMini = false, offsetIdx = 0) {
    const div = document.createElement('div');
    div.className = `card ${(c?.s==='♥'||c?.s==='♦')?'red':'black'} ${isMini?'mini-card':''}`;
    if (!c) div.className = 'card back';
    const lbl = cardLabel(c?.v);
    div.innerHTML = `<div class="card-corner">${lbl||''}<br>${c?.s||''}</div><div class="card-center">${c?.s||lbl||''}</div>`;
    return div;
}

function joinGame() { socket.emit('joinGame', { name: document.getElementById('name-input').value, room: document.getElementById('room-input').value }); }
function startGame() { socket.emit('startGame'); }
function sendRules() { socket.emit('updateRules', { limit: document.getElementById('limit-val').value }); }
function nextRound() { socket.emit('nextRound'); }
function newGame() { socket.emit('newGame'); }
function confirmDiscard() { socket.emit('discard', { indices: selected }); selected = []; }
function drawFromDeck() { socket.emit('drawFromDeck'); }
function drawFromOpen() { socket.emit('drawFromOpen'); }
function doCall() { socket.emit('call'); }

socket.on('updateState', (state) => {
    myState = state; myId = socket.id;
    if (state.status === 'LOBBY') renderLobby(state);
    else if (state.status === 'PLAYING') renderGame(state);
    else if (state.status === 'REVEAL') renderReveal(state);
    else if (state.status === 'GAMEOVER') renderGameOver(state);
});

function renderLobby(state) {
    document.getElementById('setup-menu').style.display = 'flex';
    document.getElementById('lobby-section').style.display = 'block';
    document.getElementById('join-section').style.display = 'none';
    document.getElementById('room-code-display').innerText = state.roomCode;
    const lp = document.getElementById('lobby-players'); lp.innerHTML = '';
    state.playerOrder.forEach(id => { const d = document.createElement('div'); d.innerText = state.players[id].name; lp.appendChild(d); });
    const isHost = myId === state.hostId;
    document.getElementById('host-settings').style.display = isHost ? 'block' : 'none';
    document.getElementById('start-btn').disabled = !isHost || state.playerOrder.length < 2;
}

function renderGame(state) {
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('reveal-overlay').style.display = 'none';
    document.getElementById('gameover-overlay').style.display = 'none';
    const me = state.players[myId]; const isMyTurn = state.turn === myId;

    const tb = document.getElementById('top-bar'); tb.innerHTML = '';
    tb.style.gridTemplateColumns = `repeat(${state.playerOrder.length}, 1fr)`;
    state.playerOrder.forEach(id => {
        const p = state.players[id]; const d = document.createElement('div');
        d.className = `score-pill ${id===state.turn?'active-player':''}`;
        d.innerHTML = `<div class="name">${p.name}</div><div class="pts">${state.totals[id]}</div>`;
        tb.appendChild(d);
    });

    document.getElementById('action-log').innerText = state.lastActionText;
    document.getElementById('deck-count').innerText = state.deckCount;

    const os = document.getElementById('open-stack'); os.innerHTML = '<span class="stack-label">OPEN</span>';
    const stack = state.tableStack.slice(-6);
    stack.forEach((c, i) => {
        const el = createCardEl(c);
        const isRecent = state.lastDiscardCount > 0 && i >= stack.length - state.lastDiscardCount;
        if (isRecent) {
            el.style.transform = `translate(35px, 15px) rotate(12deg)`;
            el.style.opacity = '0.8';
            el.style.border = '1px solid var(--danger)';
        } else {
            el.style.transform = `translate(${i*2}px, ${i*2}px) rotate(${i%2===0?-3:3}deg)`;
        }
        os.appendChild(el);
    });

    const ph = document.getElementById('player-hand'); ph.innerHTML = '';
    me.hand.forEach((c, i) => {
        const w = document.createElement('div'); w.className = 'card-wrap';
        if (c) {
            const el = createCardEl(c); if (selected.includes(i)) el.classList.add('selected');
            w.appendChild(el);
            w.onclick = () => {
                if (isMyTurn && state.roundState === 'DISCARD') {
                    selected.includes(i) ? selected = selected.filter(x => x !== i) : selected.push(i);
                    renderGame(state);
                } else if (!isMyTurn) socket.emit('invallen', { index: i });
            };
        } else w.innerHTML = '<div class="slot-empty"></div>';
        ph.appendChild(w);
    });

    document.getElementById('call-btn').style.display = (isMyTurn && state.roundState==='DISCARD') ? 'block' : 'none';
    const ab = document.getElementById('action-btn');
    if (isMyTurn && state.roundState==='DISCARD' && selected.length > 0) {
        ab.style.visibility = 'visible'; ab.innerText = 'GOOI WEG'; ab.onclick = confirmDiscard;
    } else { ab.style.visibility = 'hidden'; }
}

function renderReveal(state) {
    document.getElementById('reveal-overlay').style.display = 'flex';
    const g = document.getElementById('reveal-grid'); g.innerHTML = '';
    state.playerOrder.forEach(id => {
        const r = state.revealData.results[id];
        const d = document.createElement('div'); d.innerHTML = `<div>${state.players[id].name}</div><div>${r.ptsThisRound} PT</div>`;
        g.appendChild(d);
    });
}

function renderGameOver(state) {
    document.getElementById('gameover-overlay').style.display = 'flex';
    document.getElementById('go-losers').innerText = state.pendingLosers.map(id => state.players[id].name).join(' & ');
}

socket.on('error', (m) => alert(m));
socket.on('actionError', (m) => alert(m));
</script>
</body>
</html>
