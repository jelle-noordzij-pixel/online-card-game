<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 15vw; --card-h: 22vw;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); margin: 0; font-family: 'DM Mono', monospace; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        #setup-menu { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; }
        .menu-card { background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid #1e2535; width: 100%; max-width: 400px; margin: auto; text-align: center; }
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 1.3rem; cursor: pointer; margin-top: 10px; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a3040; background: var(--surface2); color: white; text-align: center; margin-top: 10px; font-size: 1.2rem; }
        .top-bar { display: grid; grid-auto-flow: column; gap: 6px; padding: 8px; background: var(--surface); border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 6px; border-radius: 8px; text-align: center; border-bottom: 2px solid #2a3040; }
        .active-player { border-bottom-color: var(--accent) !important; }
        .card { width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 6px; position: absolute; color: #000; display: flex; flex-direction: column; padding: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .card.red { color: var(--danger); }
        .card.back { background: #1e3a5f; border: 1px solid var(--accent); }
        .card.selected { transform: translateY(-20px) !important; border: 2px solid var(--accent) !important; }
        #game-area { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
        .stacks-row { display: flex; gap: 15vw; }
        #player-hand { display: flex; gap: 5px; height: var(--card-h); }
        #reveal-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: none; flex-direction: column; padding: 20px; }
        .lobby-player-item { background: var(--surface2); padding: 8px; border-radius: 8px; margin-top: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-card">
        <h1 style="font-family:'Bebas Neue'; color:var(--accent); font-size: 3rem; margin: 0;">DRANKSPEL</h1>
        <p id="welcome-text" style="font-size: 0.7rem; color: var(--muted); margin-bottom: 20px;"></p>
        
        <div id="join-options">
            <button class="btn btn-accent" onclick="createRoom()">NIEUW SPEL STARTEN</button>
            <div style="margin-top: 25px; border-top: 1px solid #1e2535; padding-top: 20px;">
                <p style="font-size: 0.6rem; color: var(--muted);">JOIN EEN VRIEND</p>
                <input id="code-input" type="number" placeholder="CODE (4 CIJFERS)" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
                <button class="btn btn-accent" onclick="joinRoom()">JOIN LOBBY</button>
            </div>
            <p onclick="doLogout()" style="color:var(--danger); cursor:pointer; font-size:0.6rem; margin-top:30px; text-decoration: underline;">UITLOGGEN</p>
        </div>

        <div id="lobby-section" style="display:none;">
            <p style="color:var(--muted); font-size:0.6rem; margin:0;">CODE VOOR VRIENDEN:</p>
            <h2 id="display-code" style="font-family:'Bebas Neue'; font-size:3.5rem; color:var(--accent); margin:5px 0;">----</h2>
            <div id="lobby-players" style="margin-bottom:20px; max-height: 150px; overflow-y: auto;"></div>
            <button id="start-btn" class="btn btn-accent" onclick="startGame()" disabled>WACHT OP SPELERS...</button>
        </div>
    </div>
</div>

<div id="reveal-overlay">
    <h2 style="font-family:'Bebas Neue'; color:var(--accent); text-align:center;">RONDE OVER</h2>
    <div id="reveal-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
    <button id="next-round-btn" class="btn btn-accent" onclick="socket.emit('nextRound')" style="display:none;">VOLGENDE RONDE</button>
</div>

<div class="top-bar" id="top-bar"></div>
<div id="game-area">
    <div id="status" style="font-size: 0.7rem; color: var(--accent);"></div>
    <div class="stacks-row">
        <div onclick="socket.emit('drawFromDeck')" style="position:relative; width:var(--card-w); height:var(--card-h);">
            <div class="card back"></div>
            <span style="position:absolute; bottom:-20px; width:100%; text-align:center; font-size:0.5rem;">DECK</span>
        </div>
        <div onclick="socket.emit('drawFromOpen')" id="open-stack" style="position:relative; width:var(--card-w); height:var(--card-h);">
            <span style="position:absolute; bottom:-20px; width:100%; text-align:center; font-size:0.5rem;">OPEN</span>
        </div>
    </div>
    <div id="player-hand"></div>
</div>
<div class="controls">
    <button id="call-btn" class="btn btn-danger" style="display:none;" onclick="socket.emit('call')">CALL!</button>
    <button id="action-btn" class="btn btn-accent" style="visibility:hidden;" onclick="confirmDiscard()">GOOI WEG</button>
</div>

<script>
const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
const socket = io();
let myId, myState, currentUser, selected = [];

async function checkAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        window.location.href = 'auth.html';
    } else {
        currentUser = session.user;
        const name = currentUser.user_metadata.username || "SPELER";
        document.getElementById('welcome-text').innerText = "INGELOGD ALS: " + name.toUpperCase();
    }
}
checkAuth();

async function doLogout() { await sb.auth.signOut(); window.location.href = 'auth.html'; }

function createCardEl(c, isMini = false, offset = 0) {
    const div = document.createElement('div');
    const type = !c ? 'back' : (c.v === 0 ? 'joker' : (c.v === 11 ? 'special' : (c.s === '♥' || c.s === '♦' ? 'red' : 'black')));
    div.className = `card ${type} ${isMini ? 'mini-card' : ''}`;
    if (!isMini && offset > 0) div.style.transform = `translate(${offset*1.5}px, ${offset*1.5}px)`;
    if (c) {
        const val = c.v === 1 ? 'A' : c.v === 11 ? 'B' : c.v === 12 ? 'V' : c.v === 13 ? 'H' : c.v === 0 ? 'J' : c.v;
        div.innerHTML = `<div class="card-corner" style="font-size:2vw">${val}<br>${c.s||''}</div><div class="card-center" style="font-size:5vw">${c.s||'JK'}</div>`;
    }
    return div;
}

function createRoom() {
    if (!currentUser) return alert("Je bent niet ingelogd!");
    socket.emit('createRoom', { userId: currentUser.id });
}

function joinRoom() {
    const codeInput = document.getElementById('code-input');
    const code = codeInput.value;
    if (code.length !== 4) return alert("Voer een 4-cijferige code in!");
    socket.emit('joinRoom', { code: code, userId: currentUser.id });
}

function startGame() { socket.emit('startGame'); }

socket.on('updateState', (state) => {
    myState = state;
    myId = socket.id;
    if (state.status === 'LOBBY') {
        document.getElementById('join-options').style.display = 'none';
        document.getElementById('lobby-section').style.display = 'block';
        document.getElementById('display-code').innerText = state.myRoomCode;
        document.getElementById('lobby-players').innerHTML = state.playerOrder.map(id => `<div class="lobby-player-item">${state.players[id].name} ${id === state.hostId ? '⭐' : ''}</div>`).join('');
        
        const startBtn = document.getElementById('start-btn');
        if (socket.id === state.hostId) {
            startBtn.disabled = state.playerOrder.length < 2;
            startBtn.innerText = "SPEL STARTEN";
        } else {
            startBtn.disabled = true;
            startBtn.innerText = "WACHT OP HOST...";
        }
    } else if (state.status === 'PLAYING') {
        renderGame(state);
    } else if (state.status === 'REVEAL') {
        renderReveal(state);
    }
});

function renderGame(state) {
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('reveal-overlay').style.display = 'none';
    const tb = document.getElementById('top-bar');
    tb.innerHTML = state.playerOrder.map(id => `<div class="score-pill ${id === state.turn ? 'active-player' : ''}"><div class="name">${state.players[id].name}</div><div class="pts">${state.totals[id]}</div></div>`).join('');
    
    const os = document.getElementById('open-stack');
    os.innerHTML = '<span class="stack-label">OPEN</span>';
    const visible = state.tableStack.slice(-6);
    visible.forEach((c, i) => {
        const el = createCardEl(c, false, i);
        os.appendChild(el);
    });

    const handDiv = document.getElementById('player-hand');
    handDiv.innerHTML = '';
    const myHand = state.players[socket.id].hand;
    myHand.forEach((c, i) => {
        const el = createCardEl(c);
        if (selected.includes(i)) el.classList.add('selected');
        el.onclick = () => {
            if (state.turn !== socket.id || state.roundState !== 'DISCARD') return;
            selected = selected.includes(i) ? selected.filter(x => x !== i) : [...selected, i];
            renderGame(state);
        };
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.appendChild(el);
        handDiv.appendChild(wrap);
    });

    document.getElementById('status').innerText = state.turn === socket.id ? "JOUW BEURT!" : `WACHTEN OP ${state.players[state.turn].name.toUpperCase()}...`;
    document.getElementById('call-btn').style.display = (state.turn === socket.id && state.roundState === 'DISCARD') ? 'block' : 'none';
    document.getElementById('action-btn').style.visibility = selected.length > 0 ? 'visible' : 'hidden';
}

function confirmDiscard() {
    socket.emit('discard', { indices: selected });
    selected = [];
}

function renderReveal(state) {
    document.getElementById('reveal-overlay').style.display = 'flex';
    const grid = document.getElementById('reveal-grid');
    grid.innerHTML = '';
    state.playerOrder.forEach(id => {
        const res = state.revealData.results[id];
        const box = document.createElement('div');
        box.style = "background:var(--surface2); padding:10px; border-radius:10px; text-align:center;";
        box.innerHTML = `<div style="font-family:'Bebas Neue';">${state.players[id].name}</div><div style="color:var(--accent); font-family:'Bebas Neue'; font-size:1.5rem;">${res.ptsThisRound} PT</div><div style="display:flex; justify-content:center; gap:3px; margin-top:5px; flex-wrap:wrap;"></div>`;
        res.hand.forEach(c => box.lastChild.appendChild(createCardEl(c, true)));
        grid.appendChild(box);
    });
    document.getElementById('next-round-btn').style.display = (socket.id === state.hostId) ? 'block' : 'none';
}

socket.on('error', (msg) => alert(msg));
</script>
</body>
</html>
