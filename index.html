<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 70px; --card-h: 100px;
            --red: #e74c3c; --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
        }
        .timer-bar-wrap { width:100%; height:3px; background:#111; }
        #timer-bar { height:100%; width:0; background:var(--accent); transition:width 0.1s linear; }
        
        .top-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap:6px; padding:10px; background:var(--surface); border-bottom:1px solid #1e2535; }
        .score-pill { background:var(--surface2); padding:5px; border-radius:8px; text-align:center; border-bottom:2px solid transparent; }
        .score-pill.active-player { border-bottom-color: var(--accent); }
        .score-pill .name { font-size: 0.7rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

        #game-area { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap: 20px; }
        
        .card {
            width: var(--card-w); height: var(--card-h); background: white; border-radius: 8px;
            color: black; display: flex; flex-direction: column; padding: 5px; position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-weight: bold;
        }
        .card.red { color: var(--red); }
        .card.selected { transform: translateY(-15px); border: 3px solid var(--accent); }

        #player-hand { display: flex; gap: 8px; padding: 20px; overflow-x: auto; width: 100%; justify-content: center; }

        .controls { padding: 20px; display: flex; gap: 10px; background: var(--surface); }
        .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; }
        .btn-accent { background: var(--accent); color: #000; }

        #setup-menu { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .input-field { width: 100%; max-width: 300px; padding: 12px; margin: 10px 0; background: var(--surface2); border: 1px solid #333; color: white; border-radius: 8px; }
    </style>
</head>
<body>

<div id="setup-menu">
    <h1 style="font-family: 'Bebas Neue'; color: var(--accent); font-size: 3rem;">DRANKSPEL</h1>
    <div id="join-section">
        <button class="btn btn-accent" style="width: 100%; margin-bottom: 10px;" onclick="createRoom()">NIEUW SPEL</button>
        <input type="number" id="code-input" class="input-field" placeholder="4-cijferige code">
        <button class="btn btn-accent" style="width: 100%;" onclick="joinRoom()">JOIN SPEL</button>
    </div>
    <div id="lobby-section" style="display:none; text-align:center;">
        <p>CODE: <span id="display-code" style="color:var(--accent); font-size: 2rem;">----</span></p>
        <div id="player-list"></div>
        <button id="start-btn" class="btn btn-accent" style="margin-top:20px;" onclick="startGame()">STARTEN</button>
    </div>
</div>

<div class="timer-bar-wrap"><div id="timer-bar"></div></div>
<div class="top-bar" id="top-bar"></div>

<div id="game-area">
    <div id="status" style="color: var(--accent);">Verbinden...</div>
    <div style="display:flex; gap: 20px;">
        <div class="card" style="background: #2c3e50; border: 2px solid var(--accent);" onclick="drawFromDeck()"></div>
        <div id="open-stack" onclick="drawFromOpen()"></div>
    </div>
    <div id="player-hand"></div>
</div>

<div class="controls">
    <button id="action-btn" class="btn btn-accent" style="display:none;" onclick="confirmDiscard()">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // --- CONFIG ---
    const SB_URL = 'https://caossvejzjutuwqsjdxc.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhb3NzdmVqemp1dHV3cXNqZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzM5MjEsImV4cCI6MjA5NDI0OTkyMX0.wjv6tRfeQX-0FORoBbSQgr-TbHWdLLThG4RPV4DCNk4';
    
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const socket = io();

    let selected = [];

    // --- FUNCTIES ---
    function createRoom() { socket.emit('createRoom', { userId: 'guest-' + Math.random().toString(36).substr(2, 4) }); }
    
    function joinRoom() {
        const code = document.getElementById('code-input').value;
        if(code) socket.emit('joinRoom', { code, userId: 'guest-' + Math.random().toString(36).substr(2, 4) });
    }

    function startGame() { socket.emit('startGame'); }
    function drawFromDeck() { socket.emit('drawFromDeck'); }
    function drawFromOpen() { socket.emit('drawFromOpen'); }
    function confirmDiscard() {
        socket.emit('discard', { indices: selected });
        selected = [];
    }

    // --- SOCKET EVENTS ---
    socket.on('updateState', (state) => {
        if (state.status === 'LOBBY') {
            document.getElementById('setup-menu').style.display = 'flex';
            document.getElementById('join-section').style.display = 'none';
            document.getElementById('lobby-section').style.display = 'block';
            document.getElementById('display-code').innerText = state.myRoomCode;
            document.getElementById('start-btn').style.display = (socket.id === state.hostId) ? 'block' : 'none';
        } else {
            document.getElementById('setup-menu').style.display = 'none';
            renderGame(state);
        }
    });

    function renderGame(state) {
        document.getElementById('status').innerText = (state.turn === socket.id) ? "JOUW BEURT" : "WACHTEN OP ANDEREN...";
        
        // Render spelers bovenaan
        const tb = document.getElementById('top-bar');
        tb.innerHTML = '';
        state.playerOrder.forEach(id => {
            const p = state.players[id];
            tb.innerHTML += `<div class="score-pill ${id === state.turn ? 'active-player' : ''}"><div class="name">${p.name || 'Speler'}</div></div>`;
        });

        // Render hand
        const handDiv = document.getElementById('player-hand');
        handDiv.innerHTML = '';
        const myHand = state.players[socket.id]?.hand || [];
        myHand.forEach((c, i) => {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${c.s === '♥' || c.s === '♦' ? 'red' : ''} ${selected.includes(i) ? 'selected' : ''}`;
            cardEl.innerHTML = `<div>${c.v}</div><div style="font-size:2rem; align-self:center; margin-top:10px;">${c.s}</div>`;
            cardEl.onclick = () => {
                if(state.turn === socket.id) {
                    selected = selected.includes(i) ? [] : [i];
                    renderGame(state);
                }
            };
            handDiv.appendChild(cardEl);
        });

        document.getElementById('action-btn').style.display = (state.turn === socket.id && selected.length > 0) ? 'block' : 'none';
    }
</script>
</body>
</html>
