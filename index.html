<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 15vw; --card-h: 22vw;
            --red: #e74c3c; --blue: #3b82f6;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(255,51,102,0.04) 0%, transparent 60%);
        }

        /* ── SCOREBAR ── */
        .top-bar { display: grid; gap: 6px; padding: 8px 10px; background: var(--surface); flex-shrink: 0; border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 7px 4px; border-radius: 8px; border-bottom: 2px solid #2a3040; text-align: center; font-size: 0.6rem; transition: all 0.3s; }
        .score-pill .name { font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; color: var(--muted); }
        .score-pill .pts { font-size: 1rem; font-family: 'Bebas Neue', sans-serif; color: var(--text); }
        .active-player { border-bottom-color: var(--accent) !important; }
        .active-player .name { color: var(--accent) !important; }

        /* ── GAME AREA ── */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; position: relative; padding: 5px 0; }
        #status { color: var(--accent); font-size: 0.65rem; text-transform: uppercase; height: 14px; text-align: center; letter-spacing: 0.1em; }

        /* ── CARDS ── */
        .card {
            width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 7px;
            display: flex; flex-direction: column; padding: 4px; position: absolute; color: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card.red { color: var(--red); }
        .card.special { color: white; background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
        .card.joker { color: #1a1a1a; background: linear-gradient(135deg, #f59e0b, #fcd34d); }
        .card.back { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); border: 2px solid rgba(0,255,204,0.2); }
        .card.selected { transform: translateY(-22px) scale(1.04) !important; border: 2px solid var(--accent) !important; z-index: 200 !important; }
        
        /* Stack highlights */
        .card-target { transform: translateX(-40px) rotate(-7deg) !important; z-index: 100 !important; border: 2px solid var(--accent) !important; }
        .card-my-discard { transform: translateX(22px) rotate(4deg) !important; z-index: 110 !important; opacity: 0.55; }

        .card-corner { font-size: 2.8vw; font-weight: 700; }
        .card-center { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 6.5vw; font-weight: bold; }

        /* ── STACKS ── */
        .stacks-row { display: flex; gap: 14vw; align-items: center; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .stack-label { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 0.5rem; color: var(--muted); }
        .deck-count { position: absolute; top: -18px; right: 0; font-size: 0.5rem; color: var(--muted); }

        /* ── HAND ── */
        #player-hand { display: flex; gap: 5px; align-items: flex-end; }
        .card-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .slot-empty { width: var(--card-w); height: var(--card-h); border: 1px dashed rgba(255,255,255,0.1); border-radius: 7px; opacity: 0.3; }

        /* ── CONTROLS ── */
        .controls { padding: 10px; display: flex; gap: 10px; background: var(--surface); border-top: 1px solid #1e2535; }
        .btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 1.1rem; cursor: pointer; }
        .btn-accent { background: var(--accent); color: #0a0d10; }
        .btn-danger { background: var(--danger); color: white; }

        /* ── REVEAL ── */
        #reveal-overlay { position: fixed; inset: 0; background: rgba(8,10,15,0.97); z-index: 1000; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
        .reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .player-result-card { background: var(--surface2); border: 1px solid #2a3040; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: center; }
        .result-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 8px; }
        .mini-card { position: static !important; width: 9vw !important; height: 13vw !important; transform: none !important; }
        .mini-card .card-corner { font-size: 2vw !important; }
        .mini-card .card-center { font-size: 5vw !important; }

        /* ── LOBBY ── */
        #setup-menu { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 25px; }
        .menu-card { background: var(--surface); border: 1px solid #1e2535; padding: 22px; border-radius: 20px; max-width: 400px; margin: 0 auto; width: 100%; }
        .start-btn { width: 100%; padding: 18px; border: none; border-radius: 14px; background: var(--accent); color: #0a0d10; font-family: 'Bebas Neue'; font-size: 1.3rem; cursor: pointer; }
        .lobby-player-item { background: var(--surface2); border-radius: 8px; padding: 8px; margin-bottom: 5px; font-size: 0.75rem; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-card">
        <h1 style="font-family:'Bebas Neue'; color:var(--accent); text-align:center; margin:0;">DRANKSPEL</h1>
        <div id="welcome-text" style="text-align:center; font-size:0.6rem; color:var(--muted); margin-bottom:20px;"></div>
        
        <div id="join-section">
            <input id="name-input" type="text" placeholder="Naam..." style="width:100%; padding:12px; margin-bottom:10px; background:var(--surface2); border:1px solid #2a3040; color:white; border-radius:10px;">
            <button class="start-btn" onclick="joinGame()">JOIN LOBBY</button>
            <span style="display:block; text-align:center; color:var(--danger); font-size:0.6rem; margin-top:15px; cursor:pointer;" onclick="doLogout()">UITLOGGEN</span>
        </div>

        <div id="lobby-section" style="display:none;">
            <div id="lobby-players" style="margin-bottom:15px;"></div>
            <button class="start-btn" id="start-btn" disabled onclick="startGame()">STARTEN</button>
        </div>
    </div>
</div>

<div id="reveal-overlay">
    <h2 id="reveal-title" style="font-family:'Bebas Neue'; text-align:center; color:var(--accent);">RONDE OVER</h2>
    <div class="reveal-grid" id="reveal-grid"></div>
    <button class="btn btn-accent" id="next-round-btn" style="margin-top:20px; display:none;" onclick="nextRound()">VOLGENDE RONDE</button>
</div>

<div class="top-bar" id="top-bar"></div>

<div id="game-area">
    <div id="status"></div>
    <div class="stacks-row">
        <div class="stack-wrap" onclick="drawFromDeck()">
            <div class="deck-count" id="deck-count"></div>
            <div class="card back"></div>
            <span class="stack-label">DECK</span>
        </div>
        <div class="stack-wrap" id="open-stack" onclick="drawFromOpen()">
            <span class="stack-label">OPEN</span>
        </div>
    </div>
    <div id="player-hand"></div>
</div>

<div class="controls">
    <button id="call-btn" class="btn btn-danger" style="display:none;" onclick="doCall()">CALL!</button>
    <button id="action-btn" class="btn btn-accent" style="visibility:hidden;" onclick="confirmDiscard()">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
const socket = io();
let myId = null;
let myState = null;
let selected = [];
let currentUser = null;

async function checkAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) window.location.href = 'auth.html';
    else {
        currentUser = session.user;
        document.getElementById('welcome-text').innerText = "Hoi " + (currentUser.user_metadata.username || "Speler");
        document.getElementById('name-input').value = currentUser.user_metadata.username || "";
    }
}
checkAuth();

async function doLogout() { await sb.auth.signOut(); window.location.href = 'auth.html'; }

function cardLabel(v) {
    if (v === 0) return 'J'; if (v === 1) return 'A';
    if (v === 11) return 'B'; if (v === 12) return 'V'; if (v === 13) return 'H';
    return v;
}

function createCardEl(c, isMini = false, offsetIdx = 0) {
    const div = document.createElement('div');
    div.className = `card ${!c ? 'back' : (c.v === 0 ? 'joker' : (c.v === 11 ? 'special' : (c.s === '♥' || c.s === '♦' ? 'red' : 'black')))}${isMini ? ' mini-card' : ''}`;
    
    if (!isMini && offsetIdx > 0) {
        div.style.transform = `translate(${offsetIdx * 1.5}px, ${offsetIdx * 1.5}px)`;
    }

    if (c) {
        const lbl = cardLabel(c.v);
        div.innerHTML = `<div class="card-corner">${lbl}<br>${c.s || ''}</div><div class="card-center">${c.s || 'JK'}</div>`;
    }
    return div;
}

function joinGame() {
    const name = document.getElementById('name-input').value;
    socket.emit('joinGame', { name, userId: currentUser.id });
}

function startGame() { socket.emit('startGame'); }
function nextRound() { socket.emit('nextRound'); }
function confirmDiscard() { socket.emit('discard', { indices: selected }); selected = []; }
function drawFromDeck() { socket.emit('drawFromDeck'); }
function drawFromOpen() { socket.emit('drawFromOpen'); }
function doCall() { socket.emit('call'); }

socket.on('connect', () => { myId = socket.id; });

socket.on('updateState', (state) => {
    myState = state;
    if (state.status === 'LOBBY') renderLobby(state);
    else if (state.status === 'PLAYING') renderGame(state);
    else if (state.status === 'REVEAL') renderReveal(state);
});

function renderLobby(state) {
    document.getElementById('setup-menu').style.display = 'flex';
    if (state.playerOrder.includes(myId)) {
        document.getElementById('join-section').style.display = 'none';
        document.getElementById('lobby-section').style.display = 'block';
    }
    const lp = document.getElementById('lobby-players');
    lp.innerHTML = state.playerOrder.map(id => `<div class="lobby-player-item">${state.players[id].name}</div>`).join('');
    const startBtn = document.getElementById('start-btn');
    startBtn.disabled = state.playerOrder.length < 2;
    startBtn.innerText = myId === state.hostId ? "SPEL STARTEN" : "WACHT OP HOST...";
}

function renderGame(state) {
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('reveal-overlay').style.display = 'none';
    
    const tb = document.getElementById('top-bar');
    tb.innerHTML = '';
    state.playerOrder.forEach(id => {
        tb.innerHTML += `<div class="score-pill ${id === state.turn ? 'active-player' : ''}">
            <div class="name">${state.players[id].name}</div>
            <div class="pts">${state.totals[id]}</div>
        </div>`;
    });

    // OPEN STACK MET ONDERLIGGENDE KAARTEN
    const os = document.getElementById('open-stack');
    os.innerHTML = '';
    const visible = state.tableStack.slice(-6);
    visible.forEach((card, idx) => {
        const el = createCardEl(card, false, idx);
        const isMyTurn = state.turn === myId;
        const dc = state.lastDiscardCount;
        
        // Logica voor highlighten van de kaart die je mag pakken
        if (isMyTurn && state.roundState === 'DRAW') {
            if (idx === visible.length - dc - 1) el.classList.add('card-target');
            if (idx >= visible.length - dc) el.classList.add('card-my-discard');
        }
        os.appendChild(el);
    });

    document.getElementById('deck-count').innerText = state.deckCount;

    // HAND
    const handDiv = document.getElementById('player-hand');
    handDiv.innerHTML = '';
    const me = state.players[myId];
    if (me && me.hand) {
        me.hand.forEach((c, i) => {
            const wrap = document.createElement('div');
            wrap.className = 'card-wrap';
            if (c) {
                const el = createCardEl(c, false, i);
                if (selected.includes(i)) el.classList.add('selected');
                wrap.appendChild(el);
                wrap.onclick = () => {
                    if (state.turn !== myId || state.roundState !== 'DISCARD') return;
                    if (selected.includes(i)) selected = selected.filter(x => x !== i);
                    else selected.push(i);
                    renderGame(state);
                };
            } else wrap.innerHTML = '<div class="slot-empty"></div>';
            handDiv.appendChild(wrap);
        });
    }

    document.getElementById('call-btn').style.display = (state.turn === myId && state.roundState === 'DISCARD') ? 'block' : 'none';
    document.getElementById('action-btn').style.visibility = (selected.length > 0) ? 'visible' : 'hidden';
}

function renderReveal(state) {
    const overlay = document.getElementById('reveal-overlay');
    overlay.style.display = 'flex';
    const grid = document.getElementById('reveal-grid');
    grid.innerHTML = '';
    
    state.playerOrder.forEach(id => {
        const r = state.revealData.results[id];
        const p = state.players[id];
        const cardBox = document.createElement('div');
        cardBox.className = 'player-result-card';
        cardBox.innerHTML = `
            <div style="font-family:'Bebas Neue';">${p.name}</div>
            <div style="font-size:1.2rem; font-family:'Bebas Neue'; color:var(--accent);">${r.ptsThisRound} PT</div>
            <div class="result-cards"></div>
        `;
        const cardRow = cardBox.querySelector('.result-cards');
        r.hand.forEach(c => cardRow.appendChild(createCardEl(c, true)));
        grid.appendChild(cardBox);
    });

    document.getElementById('next-round-btn').style.display = myId === state.hostId ? 'block' : 'none';
}
</script>
</body>
</html>
