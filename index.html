<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 18vw; --card-h: 26vw;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.05) 0%, transparent 60%);
        }
        .top-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 7px 4px; border-radius: 8px; border-bottom: 2px solid #2a3040; text-align: center; font-size: 0.6rem; }
        .score-pill.active { border-bottom-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .score-pill .name { font-family: 'Bebas Neue'; font-size: 0.9rem; color: var(--muted); }
        .score-pill.active .name { color: var(--accent); }
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #status-msg { color: var(--accent); font-size: 0.65rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .stacks-row { display: flex; gap: 10vw; align-items: center; margin-bottom: 20px; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .card {
            width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 8px;
            display: flex; flex-direction: column; padding: 6px; color: #1a1a1a;
            border: 1px solid rgba(0,0,0,0.1); font-weight: bold; position: absolute;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card.selected { transform: translateY(-25px) scale(1.05); border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent); z-index: 10; }
        .card.back { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); border: 2px solid rgba(0,255,204,0.4); position: relative; }
        .card.red { color: var(--danger); }
        .card-val { font-size: 1.1rem; line-height: 1; }
        .card-suit { margin: auto; font-size: 2rem; }
        #player-hand { display: flex; gap: 8px; padding: 20px; justify-content: center; min-height: 160px; width: 100%; overflow-x: auto; }
        .hand-slot { position: relative; width: var(--card-w); height: var(--card-h); flex-shrink: 0; }
        .controls { padding: 15px; display: flex; gap: 10px; background: var(--surface); border-top: 1px solid #1e2535; min-height: 80px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 1.3rem; cursor: pointer; transition: 0.1s; }
        .btn-accent { background: var(--accent); color: #0a0d10; }
        .btn-danger { background: var(--danger); color: white; }
        #setup-menu, #reveal-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        input { width: 100%; padding: 15px; border-radius: 10px; background: var(--surface2); color: white; border: 1px solid #2a3040; margin-bottom: 10px; font-family: 'DM Mono'; }
        .result-item { background: var(--surface2); padding: 10px; border-radius: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="setup-menu">
    <h1 style="font-family:'Bebas Neue'; color:var(--accent); text-align:center; font-size:3.5rem; margin:0;">DRANKSPEL</h1>
    <input id="p-name" type="text" placeholder="VUL JE NAAM IN">
    <button class="btn btn-accent" onclick="join()">LOBBY JOINEN</button>
    <div id="host-controls" style="display:none; margin-top:30px; border-top:1px solid #2a3040; padding-top:20px;">
        <input id="p-limit" type="number" value="100">
        <button class="btn" style="background:var(--warn);" onclick="start()">START HET SPEL</button>
    </div>
</div>

<div id="reveal-overlay" style="display:none;">
    <h2 style="font-family:'Bebas Neue'; text-align:center; color:var(--accent);">RONDE OVER</h2>
    <div id="results-list"></div>
    <button id="next-round-btn" class="btn btn-accent" onclick="socket.emit('nextRound')" style="display:none; margin-top:20px;">VOLGENDE RONDE</button>
</div>

<div class="top-bar" id="score-bar"></div>

<div id="game-area">
    <div id="status-msg">Wachten...</div>
    <div class="stacks-row">
        <div class="stack-wrap" onclick="socket.emit('drawFromDeck')">
            <div class="card back"></div>
            <div id="deck-count" style="font-size:0.5rem; text-align:center; margin-top:5px; color:var(--muted);"></div>
        </div>
        <div class="stack-wrap" id="open-stack-area" onclick="socket.emit('drawFromOpen')"></div>
    </div>
</div>

<div id="player-hand"></div>

<div class="controls">
    <button id="call-btn" class="btn btn-danger" onclick="socket.emit('call')" style="display:none;">CALL!</button>
    <button id="discard-btn" class="btn btn-accent" onclick="confirmDiscard()" style="visibility:hidden;">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let selectedIndices = [];
    let currentGameState = null;

    function join() {
        const name = document.getElementById("p-name").value;
        if(name) socket.emit("joinGame", { name });
    }

    function start() {
        socket.emit("updateRules", { limit: document.getElementById("p-limit").value });
        socket.emit("startGame");
    }

    function confirmDiscard() {
        if(selectedIndices.length > 0) {
            socket.emit("discard", { indices: selectedIndices });
            selectedIndices = [];
        }
    }

    function calcPoints(hand) {
        return hand.filter(c => c).reduce((acc, c) => {
            if (c.v === 0) return acc;
            if (c.v === 1) return acc + 1;
            if (c.v === 11) return acc - 1;
            if (c.v >= 12) return acc + 10;
            return acc + c.v;
        }, 0);
    }

    function renderHandUI() {
        const handDiv = document.getElementById("player-hand");
        handDiv.innerHTML = "";
        const myData = currentGameState.players[socket.id];
        const isMyTurn = socket.id === currentGameState.turn;
        if (myData && myData.hand) {
            myData.hand.forEach((card, i) => {
                const slot = document.createElement("div");
                slot.className = "hand-slot";
                if (card) {
                    const isRed = card.s === '♥' || card.s === '♦';
                    const cEl = document.createElement("div");
                    cEl.className = `card ${isRed ? 'red' : ''} ${selectedIndices.includes(i) ? 'selected' : ''}`;
                    const val = card.v === 0 ? 'J' : (card.v === 1 ? 'A' : (card.v === 11 ? 'B' : (card.v === 12 ? 'V' : (card.v === 13 ? 'H' : card.v))));
                    cEl.innerHTML = `<div class="card-val">${val}</div><div class="card-suit">${card.s || ''}</div>`;
                    cEl.onclick = () => {
                        if (isMyTurn && currentGameState.roundState === 'DISCARD') {
                            if (selectedIndices.includes(i)) selectedIndices = selectedIndices.filter(x => x !== i);
                            else selectedIndices.push(i);
                            renderHandUI();
                        }
                    };
                    slot.appendChild(cEl);
                }
                handDiv.appendChild(slot);
            });
            document.getElementById("discard-btn").style.visibility = (isMyTurn && selectedIndices.length > 0) ? "visible" : "hidden";
            const pts = calcPoints(myData.hand);
            document.getElementById("call-btn").style.display = (isMyTurn && currentGameState.roundState === 'DISCARD' && pts <= 5) ? "block" : "none";
        }
    }

    socket.on("updateState", (state) => {
        currentGameState = state;
        const isMyTurn = socket.id === state.turn;
        document.getElementById("setup-menu").style.display = (state.status === 'LOBBY') ? "flex" : "none";
        document.getElementById("host-controls").style.display = (socket.id === state.hostId) ? "block" : "none";
        document.getElementById("reveal-overlay").style.display = (state.status === 'REVEAL' || state.status === 'GAMEOVER') ? "flex" : "none";
        const bar = document.getElementById("score-bar");
        bar.innerHTML = "";
        state.playerOrder.forEach(id => {
            const p = state.players[id];
            bar.innerHTML += `<div class="score-pill ${state.turn === id ? 'active' : ''}"><div class="name">${p.name.toUpperCase()}</div><div style="font-size:1rem;">${state.totals[id] || 0}</div><div style="font-size:0.5rem;">🎴 ${p.handCount}</div></div>`;
        });
        if (state.status === 'PLAYING') {
            document.getElementById("status-msg").innerText = isMyTurn ? `JOUW BEURT` : `BEURT VAN ${state.players[state.turn].name}`;
            const openArea = document.getElementById("open-stack-area");
            const top = state.tableStack[state.tableStack.length - 1];
            if (top) {
                const isRed = top.s === '♥' || top.s === '♦';
                const val = top.v === 0 ? 'J' : (top.v === 1 ? 'A' : (top.v === 11 ? 'B' : (top.v === 12 ? 'V' : (top.v === 13 ? 'H' : top.v))));
                openArea.innerHTML = `<div class="card" style="color:${isRed ? 'var(--danger)' : 'black'}"><div class="card-val">${val}</div><div class="card-suit">${top.s || ''}</div></div>`;
            }
            document.getElementById("deck-count").innerText = `${state.deckCount} KAARTEN`;
            renderHandUI();
        }
        if (state.revealData) {
            document.getElementById("next-round-btn").style.display = (socket.id === state.hostId) ? "block" : "none";
            const resList = document.getElementById("results-list");
            resList.innerHTML = Object.keys(state.revealData.results).map(pid => {
                const r = state.revealData.results[pid];
                return `<div class="result-item"><span>${state.players[pid].name}</span><span>+${r.ptsThisRound} (Totaal: ${r.total})</span></div>`;
            }).join("");
        }
    });
    socket.on("actionError", (msg) => alert(msg));
</script>
</body>
</html>
