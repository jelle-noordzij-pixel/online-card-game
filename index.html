<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drankspel Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffcc; --bg: #0d1117; --card-bg: #ffffff; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        /* UI LAYOUT */
        #game-container { display: flex; flex-direction: column; height: 100%; position: relative; }
        .top-bar { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #161b22; border-bottom: 2px solid #30363d; }
        .player-tag { padding: 5px 12px; border-radius: 20px; background: #21262d; font-size: 0.8rem; border: 1px solid transparent; }
        .player-tag.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.2); }

        /* KAARTEN */
        .card { width: 65px; height: 95px; background: white; color: black; border-radius: 8px; position: relative; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: 0.2s; border: 2px solid #ddd; }
        .card.red { color: #ff4444; }
        .card.selected { transform: translateY(-20px); border: 3px solid var(--accent); }
        .card.back { background: #1e3a5f; color: transparent; border: 2px solid var(--accent); }
        
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
        #player-hand { display: flex; gap: 10px; min-height: 120px; align-items: flex-end; }
        
        /* BUTTONS */
        .btn { font-family: 'Bebas Neue'; padding: 15px 30px; font-size: 1.5rem; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-main { background: var(--accent); color: black; }
        .btn-call { background: #ff3366; color: white; position: absolute; right: 20px; bottom: 150px; }
        
        /* OVERLAYS */
        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .menu-card { background: #161b22; padding: 30px; border-radius: 15px; border: 1px solid #30363d; width: 90%; max-width: 350px; }
    </style>
</head>
<body>

<div id="setup-menu" class="overlay">
    <div class="menu-card">
        <h1 style="font-family:'Bebas Neue'; font-size: 3.5rem; color: var(--accent); margin: 0;">DRANKSPEL</h1>
        <p id="welcome-text" style="color: #8b949e;"></p>
        <div id="join-options">
            <button class="btn btn-main" style="width:100%" onclick="createRoom()">NIEUW SPEL</button>
            <input id="code-input" type="number" placeholder="4 CIJFERS" style="width:100%; margin-top:15px; padding:12px; border-radius:8px; border:none; text-align:center;">
            <button class="btn btn-main" style="width:100%; margin-top:10px; background:#30363d; color:white;" onclick="joinRoom()">JOIN VRIEND</button>
        </div>
        <div id="lobby-section" style="display:none">
            <p>DEEL DEZE CODE:</p>
            <h2 id="display-code" style="font-size:3rem; color:var(--accent); letter-spacing:5px;">----</h2>
            <div id="lobby-players" style="margin: 20px 0;"></div>
            <button id="start-btn" class="btn btn-main" onclick="startGame()" disabled>STARTEN</button>
        </div>
    </div>
</div>

<div id="game-container">
    <div class="top-bar" id="top-bar"></div>
    <div id="game-area">
        <div style="display:flex; gap:30px;">
            <div onclick="drawFromDeck()" style="text-align:center">
                <div class="card back"></div>
                <small style="display:block; margin-top:5px">DECK</small>
            </div>
            <div onclick="drawFromOpen()" id="open-stack" style="text-align:center">
                <div class="card" style="border: 2px dashed #30363d; background:transparent;"></div>
                <small style="display:block; margin-top:5px">OPEN</small>
            </div>
        </div>
        <div id="status-msg" style="color:var(--accent); font-weight:bold;"></div>
        <div id="player-hand"></div>
    </div>
    <div style="padding: 20px; text-align:center;">
        <button id="action-btn" class="btn btn-main" style="display:none" onclick="confirmDiscard()">KAARTEN AFLEGGEN</button>
        <button id="call-btn" class="btn btn-call" style="display:none" onclick="socket.emit('call')">CALL!</button>
    </div>
</div>

<script>
const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
const socket = io();
let currentUser, selected = [];

async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return window.location.href = 'auth.html';
    currentUser = session.user;
    document.getElementById('welcome-text').innerText = "Hoi, " + (currentUser.user_metadata.username || "Speler");
}
init();

function createRoom() { socket.emit('createRoom', { userId: currentUser.id }); }
function joinRoom() { 
    const c = document.getElementById('code-input').value;
    if(c.length === 4) socket.emit('joinRoom', { code: c, userId: currentUser.id });
}
function startGame() { socket.emit('startGame'); }
function drawFromDeck() { socket.emit('drawFromDeck'); }
function drawFromOpen() { socket.emit('drawFromOpen'); }
function confirmDiscard() { socket.emit('discard', { indices: selected }); selected = []; }

socket.on('updateState', (state) => {
    if (state.status === 'LOBBY') {
        document.getElementById('join-options').style.display = 'none';
        document.getElementById('lobby-section').style.display = 'block';
        document.getElementById('display-code').innerText = state.myRoomCode;
        document.getElementById('lobby-players').innerHTML = state.playerOrder.map(id => `<div>${state.players[id].name}</div>`).join('');
        document.getElementById('start-btn').disabled = (socket.id !== state.hostId || state.playerOrder.length < 1);
    } else {
        renderGame(state);
    }
});

function createCardUI(c) {
    if (!c) return '<div class="card back"></div>';
    const isRed = c.s === '♥' || c.s === '♦';
    const val = c.v === 0 ? 'JK' : (c.v === 1 ? 'A' : (c.v === 11 ? 'J' : (c.v === 12 ? 'Q' : (c.v === 13 ? 'K' : c.v))));
    return `<div class="card ${isRed?'red':''}">${val}<span>${c.s}</span></div>`;
}

function renderGame(state) {
    document.getElementById('setup-menu').style.display = 'none';
    const tb = document.getElementById('top-bar');
    tb.innerHTML = state.playerOrder.map(id => `<div class="player-tag ${id===state.turn?'active':''}">${state.players[id].name}: ${state.totals[id]}</div>`).join('');
    
    const os = document.getElementById('open-stack');
    const topCard = state.tableStack[state.tableStack.length-1];
    os.innerHTML = createCardUI(topCard) + '<small style="display:block; margin-top:5px">OPEN</small>';

    const handDiv = document.getElementById('player-hand');
    handDiv.innerHTML = '';
    state.players[socket.id].hand.forEach((c, i) => {
        const div = document.createElement('div');
        div.innerHTML = createCardUI(c);
        const cardEl = div.firstChild;
        if(selected.includes(i)) cardEl.classList.add('selected');
        cardEl.onclick = () => {
            if(state.turn === socket.id && state.roundState === 'DISCARD') {
                if(selected.includes(i)) selected = selected.filter(x => x !== i);
                else selected.push(i);
                renderGame(state);
            }
        };
        handDiv.appendChild(cardEl);
    });

    const isMyTurn = state.turn === socket.id;
    document.getElementById('status-msg').innerText = isMyTurn ? "JOUW BEURT" : "EVEN WACHTEN...";
    document.getElementById('action-btn').style.display = (isMyTurn && state.roundState === 'DISCARD' && selected.length > 0) ? 'inline-block' : 'none';
    document.getElementById('call-btn').style.display = (isMyTurn && state.roundState === 'DRAW') ? 'block' : 'none';
}

socket.on('error', (e) => alert(e));
</script>
</body>
</html>
