<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --bg: #0a0d10; --surface: #131720;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace;
            overflow: hidden; height: 100dvh; display: flex; flex-direction: column;
        }

        #lobby { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .card { background: var(--surface); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #1e2535; text-align: center; }
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--accent); margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin: 20px 0; background: #1c2130; border: 1px solid #2a3040; color: white; border-radius: 12px; outline: none; font-family: 'DM Mono'; }
        button { width: 100%; padding: 16px; background: var(--accent); color: #0a0d10; border: none; border-radius: 12px; font-family: 'Bebas Neue'; font-size: 1.4rem; cursor: pointer; }
        
        /* Logout styling */
        .logout-link { color: var(--danger); font-size: 0.6rem; text-decoration: underline; cursor: pointer; margin-left: 10px; text-transform: uppercase; }

        #game { display: none; flex: 1; flex-direction: column; padding: 10px; }
        .player-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .player-node { background: var(--surface); padding: 10px; border-radius: 10px; min-width: 100px; text-align: center; border: 1px solid transparent; }
        .player-node.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        
        #table-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #hand { display: flex; justify-content: center; gap: 5px; padding: 20px; }
        .card-item { width: 60px; height: 90px; background: white; color: black; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
        .card-item.selected { transform: translateY(-20px); border: 3px solid var(--accent); }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="card">
            <h1>DRANKSPEL</h1>
            <div style="margin-bottom: 15px; display: flex; justify-content: center; align-items: center;">
                <span id="user-welcome" style="font-size: 0.7rem; color: var(--muted);"></span>
                <span class="logout-link" onclick="doLogout()">Uitloggen</span>
            </div>
            <input type="text" id="name-input" placeholder="Je naam...">
            <button onclick="joinGame()">SPELEN</button>
            <div id="error-msg" style="color:red; font-size: 12px; margin-top:10px;"></div>
        </div>
    </div>

    <div id="game">
        <div class="player-list" id="player-list"></div>
        <div id="table-area">
            <div id="table-stack"></div>
            <div id="game-controls">
                <button id="draw-deck-btn" onclick="drawFromDeck()" style="display:none; width:auto; margin:5px;">DECK</button>
                <button id="draw-open-btn" onclick="drawFromOpen()" style="display:none; width:auto; margin:5px;">OPEN</button>
                <button id="call-btn" onclick="callKamo()" style="display:none; width:auto; margin:5px; background:red;">CALL</button>
            </div>
        </div>
        <div id="hand"></div>
        <button id="discard-btn" onclick="discard()" style="display:none;">GOOIEN</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const socket = io();
        const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
        let currentUser = null;
        let selectedIndices = [];

        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { 
                window.location.href = 'auth.html'; 
            } else { 
                currentUser = session.user;
                const username = currentUser.user_metadata.username || "Speler";
                document.getElementById('user-welcome').innerText = "HOI " + username.toUpperCase();
                document.getElementById('name-input').value = username;
            }
        }
        checkAuth();

        // UITLOG FUNCTIE
        async function doLogout() {
            await sb.auth.signOut();
            window.location.href = 'auth.html';
        }

        function joinGame() {
            const name = document.getElementById('name-input').value;
            socket.emit('joinGame', { name, userId: currentUser.id });
        }

        socket.on('updateState', (state) => {
            document.getElementById('lobby').style.display = state.status === 'LOBBY' ? 'flex' : 'none';
            document.getElementById('game').style.display = state.status === 'LOBBY' ? 'none' : 'flex';
            renderGame(state);
        });

        function renderGame(state) {
            const myId = socket.id;
            const me = state.players[myId];
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            state.playerOrder.forEach(id => {
                const p = state.players[id];
                list.innerHTML += `<div class="player-node ${state.turn === id ? 'active' : ''}">${p.name}<br>${state.totals[id]}</div>`;
            });

            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            if (me && me.hand) {
                me.hand.forEach((card, i) => {
                    if (!card) return;
                    const cNode = document.createElement('div');
                    cNode.className = `card-item ${selectedIndices.includes(i) ? 'selected' : ''}`;
                    cNode.innerText = card.v + (card.s || '');
                    cNode.onclick = () => {
                        if (selectedIndices.includes(i)) selectedIndices = selectedIndices.filter(x => x !== i);
                        else selectedIndices.push(i);
                        renderGame(state);
                    };
                    handDiv.appendChild(cNode);
                });
            }

            const isMyTurn = state.turn === myId;
            document.getElementById('discard-btn').style.display = (isMyTurn && state.roundState === 'DISCARD') ? 'block' : 'none';
            document.getElementById('draw-deck-btn').style.display = (isMyTurn && state.roundState === 'DRAW') ? 'block' : 'none';
            document.getElementById('draw-open-btn').style.display = (isMyTurn && state.roundState === 'DRAW') ? 'block' : 'none';
            document.getElementById('call-btn').style.display = (isMyTurn && state.roundState === 'DISCARD') ? 'block' : 'none';
        }

        function discard() { socket.emit('discard', { indices: selectedIndices }); selectedIndices = []; }
        function drawFromDeck() { socket.emit('drawFromDeck'); }
        function drawFromOpen() { socket.emit('drawFromOpen'); }
        function callKamo() { socket.emit('call'); }
        socket.on('error', m => document.getElementById('error-msg').innerText = m);
    </script>
</body>
</html>
