<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drankspel Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --danger: #ff3366; --warn: #ffcc00;
            --bg: #0a0d10; --surface: #131720; --surface2: #1c2130;
            --card-w: 15vw; --card-h: 22vw;
            --red: #e74c3c; --blue: #3b82f6;
            --text: #e8eaf0; --muted: #5a6480;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--text); margin: 0;
            font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(0,255,204,0.04) 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 100%, rgba(255,51,102,0.04) 0%, transparent 60%);
        }

        /* UI */
        .top-bar { display: grid; grid-auto-flow: column; gap: 6px; padding: 8px; background: var(--surface); border-bottom: 1px solid #1e2535; }
        .score-pill { background: var(--surface2); padding: 6px; border-radius: 8px; text-align: center; border-bottom: 2px solid #2a3040; }
        .active-player { border-bottom-color: var(--accent) !important; box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .score-pill .name { font-family: 'Bebas Neue'; font-size: 0.8rem; color: var(--muted); }
        .active-player .name { color: var(--accent); }
        .score-pill .pts { font-family: 'Bebas Neue'; font-size: 1rem; }

        /* CARDS */
        .card {
            width: var(--card-w); height: var(--card-h); background: #fff; border-radius: 6px;
            display: flex; flex-direction: column; padding: 4px; position: absolute; color: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }
        .card.red { color: var(--red); }
        .card.special { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; }
        .card.joker { background: linear-gradient(135deg, #f59e0b, #fcd34d); }
        .card.back { background: linear-gradient(135deg, #0f172a, #1e3a5f); border: 2px solid rgba(0,255,204,0.2); }
        .card.selected { transform: translateY(-20px) !important; border: 2px solid var(--accent) !important; z-index: 100 !important; }
        .card-target { transform: translateX(-35px) rotate(-8deg) !important; border: 2px solid var(--accent) !important; z-index: 50 !important; }
        .card-my-discard { transform: translateX(20px) rotate(5deg) !important; opacity: 0.5; }

        .card-corner { font-size: 2.5vw; font-weight: bold; line-height: 1; }
        .card-center { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 6vw; font-weight: bold; }

        /* GAME */
        #game-area { flex: 1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; position: relative; }
        .stacks-row { display: flex; gap: 15vw; align-items: center; }
        .stack-wrap { position: relative; width: var(--card-w); height: var(--card-h); cursor: pointer; }
        .stack-label { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 0.5rem; color: var(--muted); }
        #player-hand { display: flex; gap: 6px; align-items: flex-end; height: var(--card-h); margin-bottom: 20px; }
        .card-wrap { position: relative; width: var(--card-w); height: var(--card-h); }

        .controls { padding: 12px; display: flex; gap: 10px; background: var(--surface); }
        .btn { flex: 1; padding: 15px; border-radius: 10px; border: none; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* OVERLAYS */
        #setup-menu, #reveal-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; padding: 30px; }
        .menu-card { background: var(--surface); padding: 25px; border-radius: 20px; border: 1px solid #1e2535; width: 100%; max-width: 400px; margin: auto; }
        .code-display { font-family: 'Bebas Neue'; font-size: 3rem; color: var(--accent); text-align: center; letter-spacing: 5px; margin: 15px 0; }
        .reveal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; }
        .mini-card { position: static !important; width: 8vw !important; height: 12vw !important; }
        .mini-card .card-center { font-size: 4vw; }
        .mini-card .card-corner { font-size: 2vw; }
    </style>
</head>
<body>

<div id="setup-menu">
    <div class="menu-card">
        <h1 style="font-family:'Bebas Neue'; text-align:center; color:var(--accent); margin:0;">DRANKSPEL</h1>
        <p id="welcome-text" style="text-align:center; color:var(--muted); font-size:0.7rem;"></p>
        
        <div id="join-options">
            <button class="btn btn-accent" style="width:100%; margin-bottom:15px;" onclick="createRoom()">NIEUW SPEL STARTEN</button>
            <div style="display:flex; gap:10px;">
                <input id="code-input" type="number" placeholder="CODE" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--surface2); color:white; text-align:center;">
                <button class="btn btn-accent" style="flex:0.6;" onclick="joinRoom()">JOIN</button>
            </div>
            <p style="text-align:center; color:var(--danger); font-size:0.6rem; margin-top:20px; cursor:pointer;" onclick="doLogout()">UITLOGGEN</p>
        </div>

        <div id="lobby-section" style="display:none;">
            <p style="text-align:center; font-size:0.6rem; color:var(--muted); margin:0;">DEEL DEZE CODE:</p>
            <div id="display-code" class="code-display">0000</div>
            <div id="lobby-players" style="margin-bottom:20px;"></div>
            <button id="start-btn" class="btn btn-accent" style="width:100%;" onclick="startGame()" disabled>WACHT OP SPELERS...</button>
        </div>
    </div>
</div>

<div id="reveal-overlay" style="display:none;">
    <h2 style="font-family:'Bebas Neue'; color:var(--accent); text-align:center;">RONDE OVER</h2>
    <div class="reveal-grid" id="reveal-grid"></div>
    <button id="next-btn" class="btn btn-accent" style="margin-top:20px; display:none;" onclick="nextRound()">VOLGENDE RONDE</button>
</div>

<div class="top-bar" id="top-bar"></div>

<div id="game-area">
    <div id="status" style="font-size:0.6rem; color:var(--accent); letter-spacing:1px;"></div>
    <div class="stacks-row">
        <div class="stack-wrap" onclick="drawFromDeck()">
            <div class="card back"></div>
            <div id="deck-count" style="position:absolute; top:-15px; width:100%; text-align:center; font-size:0.5rem;"></div>
            <span class="stack-label">DECK</span>
        </div>
        <div class="stack-wrap" id="open-stack" onclick="drawFromOpen()">
            <span class="stack-label">OPEN STAPEL</span>
        </div>
    </div>
    <div id="player-hand"></div>
</div>

<div class="controls">
    <button id="call-btn" class="btn btn-danger" style="display:none;" onclick="doCall()">CALL!</button>
    <button id="action-btn" class="btn btn-accent" style="visibility:hidden;" onclick="confirmDiscard()">GOOI WEG</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');
const socket = io();
let myId, myState, currentUser, selected = [];

async function checkAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) window.location.href = 'auth.html';
    currentUser = session.user;
    document.getElementById('welcome-text').innerText = "INGELOGD ALS: " + (currentUser.user_metadata.username || "SPELER");
}
checkAuth();

async function doLogout() { await sb.auth.signOut(); window.location.href = 'auth.html'; }

function createCardEl(c, isMini = false, offset = 0) {
    const div = document.createElement('div');
    const type = !c ? 'back' : (c.v === 0 ? 'joker' : (c.v === 11 ? 'special' : (c.s === '♥' || c.s === '♦' ? 'red' : 'black')));
    div.className = `card ${type} ${isMini ? 'mini-card' : ''}`;
    if (!isMini && offset > 0) div.style.transform = `translate(${offset*1.5}px, ${offset*1.5}px)`;
    if (c) {
        const val = c.v === 1 ? 'A' : c.v === 11 ? 'B' : c.v === 12 ? 'V' : c.v === 13 ? 'H' : c.v === 0 ? 'J' : c.v;
        div.innerHTML = `<div class="card-corner">${val}<br>${c.s||''}</div><div class="card-center">${c.s||'JK'}</div>`;
    }
    return div;
}

function createRoom() { socket.emit('createRoom', { userId: currentUser.id }); }
function joinRoom() { 
    const code = document.getElementById('code-input').value;
    if (code.length === 4) socket.emit('joinRoom', { code, userId: currentUser.id });
}
function startGame() { socket.emit('startGame'); }
function nextRound() { socket.emit('nextRound'); }
function confirmDiscard() { socket.emit('discard', { indices: selected }); selected = []; }
function drawFromDeck() { socket.emit('drawFromDeck'); }
function drawFromOpen() { socket.emit('drawFromOpen'); }
function doCall() { socket.emit('call'); }

socket.on('connect', () => { myId = socket.id; });
socket.on('updateState', (state) => {
    myState = state;
    if (state.status === 'LOBBY') renderLobby(state);
    else if (state.status === 'PLAYING') renderGame(state);
    else if (state.status === 'REVEAL') renderReveal(state);
});

function renderLobby(state) {
    document.getElementById('setup-menu').style.display = 'flex';
    document.getElementById('join-options').style.display = 'none';
    document.getElementById('lobby-section').style.display = 'block';
    document.getElementById('display-code').innerText = state.myRoomCode;
    const lp = document.getElementById('lobby-players');
    lp.innerHTML = state.playerOrder.map(id => `<div style="background:var(--surface2); padding:8px; border-radius:5px; margin-bottom:5px; font-size:0.7rem;">${state.players[id].name} ${id === state.hostId ? '⭐' : ''}</div>`).join('');
    const btn = document.getElementById('start-btn');
    if (myId === state.hostId) {
        btn.disabled = state.playerOrder.length < 2;
        btn.innerText = "SPEL STARTEN";
    } else {
        btn.innerText = "WACHT OP HOST...";
    }
}

function renderGame(state) {
    document.getElementById('setup-menu').style.display = 'none';
    document.getElementById('reveal-overlay').style.display = 'none';
    const tb = document.getElementById('top-bar');
    tb.innerHTML = state.playerOrder.map(id => `
        <div class="score-pill ${id === state.turn ? 'active-player' : ''}">
            <div class="name">${state.players[id].name}</div>
            <div class="pts">${state.totals[id]}</div>
        </div>
    `).join('');

    const os = document.getElementById('open-stack');
    os.innerHTML = '<span class="stack-label">OPEN STAPEL</span>';
    const visible = state.tableStack.slice(-6);
    visible.forEach((c, i) => {
        const el = createCardEl(c, false, i);
        if (state.turn === myId && state.roundState === 'DRAW') {
            if (i === visible.length - (state.lastDiscardCount||1) - 1) el.classList.add('card-target');
            if (i >= visible.length - (state.lastDiscardCount||1)) el.classList.add('card-my-discard');
        }
        os.appendChild(el);
    });

    const handDiv = document.getElementById('player-hand');
    handDiv.innerHTML = '';
    state.players[myId].hand.forEach((c, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        const el = createCardEl(c);
        if (selected.includes(i)) el.classList.add('selected');
        wrap.appendChild(el);
        wrap.onclick = () => {
            if (state.turn !== myId || state.roundState !== 'DISCARD') return;
            selected = selected.includes(i) ? selected.filter(x => x !== i) : [...selected, i];
            renderGame(state);
        };
        handDiv.appendChild(wrap);
    });

    document.getElementById('status').innerText = state.turn === myId ? "JOUW BEURT!" : `WACHTEN OP ${state.players[state.turn].name}...`;
    document.getElementById('call-btn').style.display = (state.turn === myId && state.roundState === 'DISCARD') ? 'block' : 'none';
    document.getElementById('action-btn').style.visibility = selected.length > 0 ? 'visible' : 'hidden';
}

function renderReveal(state) {
    const overlay = document.getElementById('reveal-overlay');
    overlay.style.display = 'flex';
    const grid = document.getElementById('reveal-grid');
    grid.innerHTML = '';
    state.playerOrder.forEach(id => {
        const res = state.revealData.results[id];
        const box = document.createElement('div');
        box.style = "background:var(--surface2); padding:10px; border-radius:10px; text-align:center;";
        box.innerHTML = `<div style="font-family:'Bebas Neue';">${state.players[id].name}</div><div style="color:var(--accent); font-family:'Bebas Neue'; font-size:1.5rem;">${res.ptsThisRound} PT</div><div style="display:flex; justify-content:center; gap:3px; margin-top:5px;"></div>`;
        res.hand.forEach(c => box.lastChild.appendChild(createCardEl(c, true)));
        grid.appendChild(box);
    });
    document.getElementById('next-btn').style.display = myId === state.hostId ? 'block' : 'none';
}
</script>
</body>
</html>
