<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drankspel — Inloggen</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00ffcc; --bg: #0a0d10; --surface: #131720; --text: #e8eaf0; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--surface); padding: 30px; border-radius: 20px; border: 1px solid #1e2535; width: 100%; max-width: 350px; text-align: center; }
        h1 { font-family: 'Bebas Neue'; font-size: 3rem; color: var(--accent); margin: 0 0 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #2a3040; background: #1c2130; color: white; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: black; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 5px; cursor: pointer; color: #5a6480; font-size: 0.8rem; text-transform: uppercase; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <h1>DRANKSPEL</h1>
    <div class="tabs">
        <div id="t-login" class="tab active" onclick="switchTab('login')">Inloggen</div>
        <div id="t-reg" class="tab" onclick="switchTab('reg')">Registreren</div>
    </div>

    <div id="f-login">
        <input type="email" id="l-email" placeholder="E-mailadres">
        <input type="password" id="l-pw" placeholder="Wachtwoord">
        <button onclick="doLogin()">INLOGGEN</button>
    </div>

    <div id="f-reg" style="display:none">
        <input type="text" id="r-name" placeholder="Gebruikersnaam">
        <input type="email" id="r-email" placeholder="E-mailadres">
        <input type="password" id="r-pw" placeholder="Wachtwoord (min. 6)">
        <button onclick="doRegister()">ACCOUNT AANMAKEN</button>
    </div>
    <p id="msg" style="font-size:0.7rem; margin-top:15px;"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sb = supabase.createClient('https://caossvejzjutuwqsjdxc.supabase.co', 'sb_publishable_-I-ilTRgOdHHcHv2s7rJ7g_ecncNr46');

    function switchTab(t) {
        document.getElementById('f-login').style.display = t === 'login' ? 'block' : 'none';
        document.getElementById('f-reg').style.display = t === 'reg' ? 'block' : 'none';
        document.getElementById('t-login').className = t === 'login' ? 'tab active' : 'tab';
        document.getElementById('t-reg').className = t === 'reg' ? 'tab active' : 'tab';
    }

    async function doLogin() {
        const { error } = await sb.auth.signInWithPassword({
            email: document.getElementById('l-email').value,
            password: document.getElementById('l-pw').value
        });
        if (error) document.getElementById('msg').innerText = error.message;
        else window.location.href = '/';
    }

    async function doRegister() {
        const email = document.getElementById('r-email').value;
        const password = document.getElementById('r-pw').value;
        const username = document.getElementById('r-name').value;
        
        const { error } = await sb.auth.signUp({
            email, password,
            options: { data: { username: username } }
        });
        
        if (error) document.getElementById('msg').innerText = error.message;
        else document.getElementById('msg').innerText = "Check je e-mail voor de bevestiging!";
    }
</script>
</body>
</html>
