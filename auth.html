<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - Drankspel</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ffcc; --bg: #0a0d10; --surface: #131720; --text: #e8eaf0; --danger: #ff3366;
        }
        body {
            background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;
        }
        .auth-container {
            background: var(--surface); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center;
            border: 1px solid #1e2535;
        }
        h1 { font-family: 'Bebas Neue'; color: var(--accent); font-size: 3rem; margin-top: 0; }
        input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: #1c2130; border: 1px solid #2a3040;
            color: white; border-radius: 8px; box-sizing: border-box; font-family: 'DM Mono', monospace;
        }
        button {
            width: 100%; padding: 15px; border-radius: 10px; border: none; font-family: 'Bebas Neue'; font-size: 1.2rem;
            cursor: pointer; margin-bottom: 10px;
        }
        .btn-login { background: var(--accent); color: #000; }
        .btn-register { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        #error-msg { color: var(--danger); font-size: 0.8rem; margin-bottom: 15px; min-height: 20px; }
    </style>
</head>
<body>

<div class="auth-container">
    <h1>DRANKSPEL LOGIN</h1>
    <div id="error-msg"></div>
    <input type="email" id="email" placeholder="E-mailadres" required>
    <input type="password" id="password" placeholder="Wachtwoord" required>
    <button class="btn-login" onclick="login()">INLOGGEN</button>
    <button class="btn-register" onclick="register()">REGISTREREN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const sb = supabase.createClient(
        'https://caossvejzjutuwqsjdxc.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhb3NzdmVqemp1dHV3cXNqZHhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzM5MjEsImV4cCI6MjA5NDI0OTkyMX0.wjv6tRfeQX-0FORoBbSQgr-TbHWdLLThG4RPV4DCNk4'
    );

    const errorMsg = document.getElementById('error-msg');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // Als je al ingelogd bent, stuur direct door naar de game
    sb.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'index.html';
    });

    async function login() {
        errorMsg.innerText = "Bezig met inloggen...";
        const { error } = await sb.auth.signInWithPassword({
            email: emailInput.value,
            password: passwordInput.value
        });
        if (error) {
            errorMsg.innerText = error.message;
        } else {
            window.location.href = 'index.html';
        }
    }

    async function register() {
        errorMsg.innerText = "Bezig met registreren...";
        const { error } = await sb.auth.signUp({
            email: emailInput.value,
            password: passwordInput.value
        });
        if (error) {
            errorMsg.innerText = error.message;
        } else {
            errorMsg.style.color = 'var(--accent)';
            errorMsg.innerText = "Account aangemaakt! Je kunt nu inloggen.";
        }
    }
</script>
</body>
</html>
